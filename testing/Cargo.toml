[package]
name = "lean-sphincs-testing"
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
publish = false

[dependencies]
lean-sphincs = { path = "../crates/lean-sphincs" }
alloy-primitives = { version = "1.7.3", default-features = false }
lean-verifier = { path = "../crates/lean-verifier", optional = true }
reference-sphincs = { package = "lean_sphincs", git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
rand_chacha = "=0.9.0"
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
asm-keccak = ["lean-sphincs/asm-keccak", "lean-verifier?/asm-keccak"]
aggregate = ["dep:lean-verifier"]
tiny-keccak = ["alloy-primitives/tiny-keccak"]
cache-regression = ["alloy-primitives/keccak-cache-global", "alloy-primitives/keccak-cache-stats"]

[[bin]]
name = "differential"
path = "src/bin/differential.rs"

[[test]]
name = "cache_regression"
path = "tests/cache_regression.rs"
required-features = ["cache-regression"]

[profile.release]
lto = "thin"
codegen-units = 1

[workspace]
