[package]
name = "lean-aggregation"
version = "0.1.0"
publish = false
edition.workspace = true
rust-version = "1.97.1"
description = "leanSPHINCS aggregation with Alloy types and the pinned leanVM backend"
license.workspace = true
readme = "README.md"
repository.workspace = true
keywords = ["ethereum", "post-quantum", "sphincs", "cryptography"]
categories = ["cryptography"]

[dependencies]
lean-sphincs.workspace = true
lean_vm.workspace = true

[features]
default = []
asm-keccak = ["lean-sphincs/asm-keccak"]
experimental-prover = ["lean_vm/experimental_prover"]

[[bench]]
name = "adapter"
harness = false

[lints]
workspace = true
