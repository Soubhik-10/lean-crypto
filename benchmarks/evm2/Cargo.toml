[package]
name = "lean-sphincs-evm2-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
lean-sphincs = { path = "../.." }
reference-keccak = { package = "keccak256", git = "https://github.com/leanEthereum/leanVM", rev = "6a828ecf5b17d0dde4a38bf21d4e14b81d2d7f3b" }
reference-sphincs = { package = "lean_sphincs", git = "https://github.com/leanEthereum/leanVM", rev = "6a828ecf5b17d0dde4a38bf21d4e14b81d2d7f3b" }
alloy-primitives = { git = "https://github.com/alloy-rs/core", rev = "70a63bd609da78dcf03e593ae772fec883ce7768", version = "1.7.3", default-features = false }
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "e681662b6d9ec59edafd112f7c8d64f49f1e6dd1", default-features = false, features = ["std"] }
secp256k1 = { version = "0.33.1", features = ["recovery"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

divan = { package = "codspeed-divan-compat", git = "https://github.com/CodSpeedHQ/codspeed-rust", rev = "aa1bc87957a9c69f09c40fc2de1cf2355a96b7aa", version = "6.0.0" }

tiny-keccak = { version = "=2.0.2", optional = true, features = ["keccak"] }

[features]
default = ["secp256k1"]
secp256k1 = ["evm2/secp256k1"]
asm-keccak = ["lean-sphincs/asm-keccak", "evm2/asm-keccak"]
tiny-keccak = ["alloy-primitives/tiny-keccak", "dep:tiny-keccak"]
experimental-simd = []

[[bench]]
name = "verify"
path = "verify.rs"
harness = false

[[test]]
name = "batched"
path = "batched_tests.rs"

[[bench]]
name = "codspeed"
path = "codspeed.rs"
harness = false

[[bench]]
name = "matrix"
path = "matrix.rs"
harness = false

[[bench]]
name = "keccak_codegen"
path = "keccak_codegen.rs"
harness = false
required-features = ["tiny-keccak"]

[profile.bench]
lto = "thin"
codegen-units = 1

# Use the same pinned Alloy types throughout evm2 and the verifier.
[patch.crates-io]
alloy-primitives = { git = "https://github.com/alloy-rs/core", rev = "70a63bd609da78dcf03e593ae772fec883ce7768", version = "1.7.3" }
