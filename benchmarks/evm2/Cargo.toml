[package]
name = "lean-sphincs-evm2-bench"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[dependencies]
lean-sphincs = { path = "../.." }
reference-sphincs = { package = "lean_sphincs", git = "https://github.com/leanEthereum/leanVM", rev = "f7ba4999ae523b94c8d0969b32762c3effea4cbd" }
alloy-primitives = { git = "https://github.com/alloy-rs/core", rev = "70a63bd609da78dcf03e593ae772fec883ce7768", version = "1.7.3", default-features = false }
evm2 = { git = "https://github.com/alloy-rs/evm2", rev = "e681662b6d9ec59edafd112f7c8d64f49f1e6dd1", default-features = false, features = ["std"] }
secp256k1 = { version = "0.33.1", features = ["recovery"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

divan = { package = "codspeed-divan-compat", git = "https://github.com/CodSpeedHQ/codspeed-rust", rev = "aa1bc87957a9c69f09c40fc2de1cf2355a96b7aa", version = "6.0.0" }

[features]
default = ["secp256k1"]
secp256k1 = ["evm2/secp256k1"]
asm-keccak = ["lean-sphincs/asm-keccak", "evm2/asm-keccak"]

[[bench]]
name = "verify"
path = "verify.rs"
harness = false

[[bench]]
name = "codspeed"
path = "codspeed.rs"
harness = false

[profile.bench]
lto = "thin"
codegen-units = 1

# Use the same pinned Alloy types throughout evm2 and the verifier.
[patch.crates-io]
alloy-primitives = { git = "https://github.com/alloy-rs/core", rev = "70a63bd609da78dcf03e593ae772fec883ce7768", version = "1.7.3" }
