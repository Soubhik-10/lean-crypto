[workspace]
members = ["crates/*"]
exclude = ["testing", "fuzz", "benchmarks/evm2"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Soubhik-10/lean-sphincs"

[workspace.dependencies]
lean-sphincs = { path = "crates/lean-sphincs", version = "0.1.0", default-features = false }
lean_vm = { git = "https://github.com/Rimeeeeee/leanVM", rev = "84780fb42667bc288c0e567c125b7e10479fb568", default-features = false }
alloy-primitives = { git = "https://github.com/alloy-rs/core", rev = "70a63bd609da78dcf03e593ae772fec883ce7768", version = "1.7.3", default-features = false }
wide = { version = "0.7.33", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
uninlined_format_args = "warn"
redundant_clone = "warn"

[profile.bench]
lto = "thin"
codegen-units = 1
