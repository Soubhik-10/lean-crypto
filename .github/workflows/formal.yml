name: Lean proofs and Rust conformance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      verifier_only:
        description: Run only the aggregate verifier checks
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: formal-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  proofs:
    if: github.event_name != 'workflow_dispatch' || !inputs.verifier_only
    name: Kernel-check SPHINCS and implementation proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Read the upstream pin
        id: upstream
        run: |
          python3 - <<'PY'
          import json, os, re
          pin = json.load(open('formal/upstream.json', encoding='utf-8'))
          assert pin['repository'] == 'leanEthereum/leanVM'
          assert re.fullmatch('[0-9a-f]{40}', pin['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('revision=' + pin['revision'], file=output)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: leanEthereum/leanVM
          ref: ${{ steps.upstream.outputs.revision }}
          path: formal/.cache/leanVM
          sparse-checkout: formal
          persist-credentials: false
      - name: Check the toolchain pin and forbid proof escapes
        run: |
          reference=formal/.cache/leanVM/formal
          python3 - <<'PY'
          import json
          from pathlib import Path
          pin = json.loads(Path('formal/upstream.json').read_text())
          reference = Path('formal/.cache/leanVM/formal')
          for package in ('Statement', 'common', 'lean_sphincs'):
              assert (reference / package / 'lean-toolchain').read_text().strip() == pin['toolchain']
              config = (reference / package / 'lakefile.toml').read_text()
              assert 'skipKernelTC' not in config and 'debug.' not in config
          PY
          python3 -I "$reference/tools/escape-scan.py" "$reference/Statement" "$reference/common" "$reference/lean_sphincs" formal/Implementation.lean formal/Implementation
      - name: Restore the pinned proof build
        id: lake-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            formal/.cache/leanVM/formal/lean_sphincs/.lake
            !formal/.cache/leanVM/formal/lean_sphincs/.lake/packages/mathlib/.lake
            formal/.cache/leanVM/formal/common/.lake/build
            formal/.cache/leanVM/formal/Statement/.lake/build
          key: sphincs-proofs-2-${{ runner.os }}-${{ runner.arch }}-${{ steps.upstream.outputs.revision }}-${{ hashFiles('formal/Implementation.lean', 'formal/Implementation/**/*.lean', 'scripts/prepare_formal.py') }}
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: formal/.cache/leanVM/formal/lean_sphincs
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Install this repository's implementation proof targets
        run: python3 -I scripts/prepare_formal.py
      - name: Build the proofs and the executable Lean models
        working-directory: formal/.cache/leanVM/formal/lean_sphincs
        run: |
          set -o pipefail
          python3 -I ../lake-build.py . Sphincs FORS FORS.Axioms signature-kat Implementation Implementation.Axioms implementation-kat 2>&1 | tee "$RUNNER_TEMP/lean-build.log"
      - name: Check the end theorems' axiom footprint
        working-directory: formal/.cache/leanVM/formal/lean_sphincs
        run: |
          set -o pipefail
          theorems='Sphincs.leanSphincsStronglyUnforgeable FORS.Lifetimes.h26_layered_adversary FORS.h26_layered'
          { echo 'import Sphincs'; for theorem in $theorems; do echo "#print axioms $theorem"; done; } > "$RUNNER_TEMP/axioms.lean"
          lake env lean "$RUNNER_TEMP/axioms.lean" | tee "$RUNNER_TEMP/axioms.txt"
          for theorem in $theorems; do
            grep -qF "'$theorem' depends on axioms: [propext, Classical.choice, Quot.sound]" "$RUNNER_TEMP/axioms.txt"
          done
      - name: Independently check every implementation theorem's dependencies
        working-directory: formal/.cache/leanVM/formal/lean_sphincs
        run: |
          set -o pipefail
          lake env lean -DwarningAsError=true Implementation/Axioms.lean | tee "$RUNNER_TEMP/implementation-axioms.txt"
      - name: Save the pinned proof build
        if: github.ref == 'refs/heads/main' && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            formal/.cache/leanVM/formal/lean_sphincs/.lake
            !formal/.cache/leanVM/formal/lean_sphincs/.lake/packages/mathlib/.lake
            formal/.cache/leanVM/formal/common/.lake/build
            formal/.cache/leanVM/formal/Statement/.lake/build
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
      - name: Save the checked Lean model executable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lean-sphincs-model
          include-hidden-files: true
          path: |
            formal/.cache/leanVM/formal/lean_sphincs/.lake/build/bin/signature-kat
            formal/.cache/leanVM/formal/lean_sphincs/.lake/build/bin/implementation-kat
          if-no-files-found: error
          retention-days: 7
      - name: Save proof logs and provenance
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lean-sphincs-proof-evidence
          include-hidden-files: true
          path: |
            formal/upstream.json
            formal/Implementation.lean
            formal/Implementation/
            formal/.cache/implementation-sources.json
            ${{ runner.temp }}/implementation-axioms.txt
            ${{ runner.temp }}/lean-build.log
            ${{ runner.temp }}/axioms.txt
          if-no-files-found: warn
          retention-days: 30

  conformance:
    name: Rust versus Lean (${{ matrix.cpu.name }}, ${{ matrix.backend.name }})
    needs: proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        cpu:
          - { name: SSE2, flags: '-C target-cpu=x86-64' }
          - { name: AVX2, flags: '-C target-cpu=x86-64-v3' }
        backend:
          - { name: RustCrypto, features: '' }
          - { name: assembly, features: asm-keccak }
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      RUSTFLAGS: ${{ matrix.cpu.flags }}
      FEATURES: ${{ matrix.backend.features }}
      CPU: ${{ matrix.cpu.name }}
      FORMAL_CASES_DIR: ${{ github.workspace }}/formal/.cache/cases
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: lean-sphincs-model
          path: formal/.cache/bin
      - name: Install Rust and check the runner
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          if [[ "$CPU" == AVX2 ]] && ! grep -qw avx2 /proc/cpuinfo; then
            echo 'The AVX2 comparison requires an AVX2-capable runner.' >&2
            exit 1
          fi
          chmod +x formal/.cache/bin/signature-kat formal/.cache/bin/implementation-kat
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: core-${{ matrix.cpu.name }}-${{ matrix.backend.name }}
      - name: Export results from this Rust implementation
        run: |
          export FORMAL_SEED=${GITHUB_SHA:0:16}
          cargo test -p lean-sphincs --release --locked --features "$FEATURES" --test formal_conformance -- --ignored --nocapture
          cargo test -p lean-sphincs --release --locked --features "$FEATURES" --lib wots::formal::export_lean_components -- --ignored --exact --nocapture
      - name: Compare every result with the Lean model
        run: |
          python3 -m unittest discover -s scripts -p test_run_formal.py
          python3 scripts/run_formal.py formal/.cache/bin/signature-kat "$FORMAL_CASES_DIR" --component-binary formal/.cache/bin/implementation-kat --log formal/.cache/comparison.log
          python3 scripts/check_formal_rejection.py formal/.cache/bin/signature-kat "$FORMAL_CASES_DIR" --component-binary formal/.cache/bin/implementation-kat --log-directory formal/.cache/rejection
      - name: Save the replayable corpus and comparison log
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lean-conformance-${{ matrix.cpu.name }}-${{ matrix.backend.name }}
          include-hidden-files: true
          path: |
            formal/.cache/cases/
            formal/.cache/comparison*.log
            formal/.cache/rejection/
            formal/upstream.json
          if-no-files-found: warn
          retention-days: 30

  verifier-proofs:
    name: Kernel-check pinned VM and wire proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      RUSTFLAGS: '-C target-cpu=x86-64-v3'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Read the verifier reference pin
        id: reference
        run: |
          python3 - <<'PY'
          import json, os, re
          pin = json.load(open('crates/lean-verifier/reference.json'))
          assert pin['repository'] == 'https://github.com/Rimeeeeee/leanVM'
          assert re.fullmatch('[0-9a-f]{40}', pin['revision'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('revision=' + pin['revision'], file=output)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: leanEthereum/leanVM
          ref: ${{ steps.reference.outputs.revision }}
          path: formal/.cache/verifier-reference
          persist-credentials: false
      - name: Export the pinned guest constants required by the VM model
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          grep -qw avx2 /proc/cpuinfo
          reference="$GITHUB_WORKSPACE/formal/.cache/verifier-reference"
          cargo run --release --locked --manifest-path "$reference/formal/lean_vm/scripts/guest-export/Cargo.toml" -- "$reference/formal/lean_vm"
      - name: Validate native sources, toolchains and proof escapes
        run: |
          reference=formal/.cache/verifier-reference
          python3 -I scripts/check_verifier_reference.py "$reference"
          python3 -I "$reference/formal/tools/escape-scan.py" "$reference/formal/Statement" "$reference/formal/common" "$reference/formal/lean_vm" "$reference/formal/lean_sphincs" "$reference/formal/lean_xmss" "$reference/formal/lean_da" formal/Verifier/Axioms.lean
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: verifier-cache
        with:
          path: |
            formal/.cache/verifier-reference/formal/lean_vm/.lake
            !formal/.cache/verifier-reference/formal/lean_vm/.lake/packages/mathlib/.lake
            formal/.cache/verifier-reference/formal/common/.lake/build
            formal/.cache/verifier-reference/formal/Statement/.lake/build
            formal/.cache/verifier-reference/formal/lean_sphincs/.lake/build
            formal/.cache/verifier-reference/formal/lean_xmss/.lake/build
            formal/.cache/verifier-reference/formal/lean_da/.lake/build
          key: verifier-proofs-1-${{ runner.os }}-${{ runner.arch }}-${{ steps.reference.outputs.revision }}
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1
        with:
          lake-package-directory: formal/.cache/verifier-reference/formal/lean_vm
          auto-config: false
          build: false
          test: false
          lint: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Build VM end theorems, wire proofs and executable models
        working-directory: formal/.cache/verifier-reference/formal/lean_vm
        run: |
          set -o pipefail
          python3 -I ../lake-build.py . LeanVM.Protocol.KnowledgeSoundness LeanVM.Prover.End LeanVM.Wire.OneEncoding leanvm-verify wire-diff --jobs 2 --mem 10 --cap 14 2>&1 | tee "$RUNNER_TEMP/verifier-lean-build.log"
      - name: Check all end-theorem dependencies
        working-directory: formal/.cache/verifier-reference/formal/lean_vm
        run: |
          set -o pipefail
          lake env lean -DwarningAsError=true "$GITHUB_WORKSPACE/formal/Verifier/Axioms.lean" | tee "$RUNNER_TEMP/verifier-axioms.txt"
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        if: github.event_name != 'pull_request' && steps.verifier-cache.outputs.cache-hit != 'true'
        with:
          path: |
            formal/.cache/verifier-reference/formal/lean_vm/.lake
            !formal/.cache/verifier-reference/formal/lean_vm/.lake/packages/mathlib/.lake
            formal/.cache/verifier-reference/formal/common/.lake/build
            formal/.cache/verifier-reference/formal/Statement/.lake/build
            formal/.cache/verifier-reference/formal/lean_sphincs/.lake/build
            formal/.cache/verifier-reference/formal/lean_xmss/.lake/build
            formal/.cache/verifier-reference/formal/lean_da/.lake/build
          key: ${{ steps.verifier-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: lean-verifier-models
          path: |
            formal/.cache/verifier-reference/formal/lean_vm/.lake/build/bin/leanvm-verify
            formal/.cache/verifier-reference/formal/lean_vm/.lake/build/bin/wire-diff
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: lean-verifier-proof-evidence
          path: |
            crates/lean-verifier/reference.json
            formal/Verifier/Axioms.lean
            ${{ runner.temp }}/verifier-lean-build.log
            ${{ runner.temp }}/verifier-axioms.txt
          retention-days: 30

  verifier-conformance:
    name: Aggregate verifier versus Lean (${{ matrix.backend.name }})
    needs: verifier-proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend:
          - { name: default, features: '' }
          - { name: assembly, features: asm-keccak }
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      RUSTFLAGS: '-C target-cpu=x86-64-v3'
      FEATURES: ${{ matrix.backend.features }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Read the verifier pin
        id: reference
        run: |
          python3 - <<'PY'
          import json, os
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              print('revision=' + json.load(open('crates/lean-verifier/reference.json'))['revision'], file=output)
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: leanEthereum/leanVM
          ref: ${{ steps.reference.outputs.revision }}
          path: formal/.cache/verifier-reference
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: lean-verifier-models
          path: formal/.cache/verifier-models
      - name: Install Rust and check CPU support
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          grep -qw avx2 /proc/cpuinfo
          chmod +x formal/.cache/verifier-models/*
          python3 -I scripts/check_verifier_reference.py formal/.cache/verifier-reference
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          shared-key: verifier-${{ matrix.backend.name }}
      - name: Build the production-source test bridge
        run: cargo build -p lean-verifier --release --locked --example conformance --features "$FEATURES"
      - name: Generate and verify the pinned native proof corpus
        run: bash formal/.cache/verifier-reference/formal/lean_vm/scripts/export-verifier-fixtures-rust.sh "$GITHUB_WORKSPACE/formal/.cache/verifier-fixtures"
      - name: Compare verdicts and wire encodings with Lean
        run: |
          set -o pipefail
          python3 -I scripts/check_verifier_conformance.py formal/.cache/verifier-reference formal/.cache/verifier-fixtures target/release/examples/conformance --models formal/.cache/verifier-models --output formal/.cache/verifier-results --jobs 2 2>&1 | tee "$RUNNER_TEMP/verifier-conformance.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: lean-verifier-conformance-${{ matrix.backend.name }}
          include-hidden-files: true
          path: |
            formal/.cache/verifier-results
            formal/.cache/verifier-fixtures
            ${{ runner.temp }}/verifier-conformance.log
          retention-days: 30
