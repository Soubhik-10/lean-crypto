name: Aggregation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aggregation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RUSTUP_TOOLCHAIN: 1.97.1
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  experimental:
    name: Experimental prover interoperability
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - name: Install Rust
        run: rustup toolchain install 1.97.1 --profile minimal --component clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test reference interoperability and recursive pruning
        run: cargo test -p lean-aggregation --release --locked --features experimental-prover,asm-keccak
      - name: Lint the adapter and its tests and benchmarks
        run: cargo clippy -p lean-aggregation --release --locked --all-targets --all-features -- -D warnings
