name: CodSpeed

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: codspeed-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmarks:
    name: Benchmarks (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: RustCrypto / SSE2
            features: ""
            flags: '-C target-cpu=x86-64'
            avx2: '0'
          - name: asm-keccak / SSE2
            features: asm-keccak
            flags: '-C target-cpu=x86-64'
            avx2: '0'
          - name: RustCrypto / AVX2
            features: ""
            flags: '-C target-cpu=x86-64-v3'
            avx2: '1'
          - name: asm-keccak / AVX2
            features: asm-keccak
            flags: '-C target-cpu=x86-64-v3'
            avx2: '1'
    defaults:
      run:
        working-directory: benchmarks/evm2
    env:
      RUSTUP_TOOLCHAIN: 1.97.1
      FEATURES: ${{ matrix.features }}
      RUSTFLAGS: ${{ matrix.flags }}
      LEAN_SPHINCS_EXPECT_AVX2: ${{ matrix.avx2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal
      - name: Check runner instruction support
        run: |
          if [[ "$LEAN_SPHINCS_EXPECT_AVX2" == 1 ]] && ! grep -qw avx2 /proc/cpuinfo; then
            echo 'The AVX2 benchmark requires an AVX2-capable runner.' >&2
            exit 1
          fi
      - name: Validate signatures
        run: cargo test -p lean-sphincs --manifest-path ../../Cargo.toml --release --locked --features "$FEATURES"
      - name: Install cargo-codspeed
        run: cargo install cargo-codspeed --git https://github.com/CodSpeedHQ/codspeed-rust --rev aa1bc87957a9c69f09c40fc2de1cf2355a96b7aa --locked
      - name: Build benchmarks
        run: cargo codspeed build --bench codspeed --features "$FEATURES"
      - name: Run and upload benchmarks
        uses: CodSpeedHQ/action@af75f77f17a054769abefaa42fe8dc2975469b5f # v5
        with:
          mode: simulation
          working-directory: benchmarks/evm2
          run: cargo codspeed run
